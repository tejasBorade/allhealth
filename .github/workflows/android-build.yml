name: Android debug APK

# Manual only — an APK build is heavier and rarer than the cron workflows,
# and there's no Android SDK/Java locally in dev, so this is the only way
# to produce an installable APK without installing multi-GB of tooling.
# Produces a debug-signed APK (sideload/testing only, not Play Store ready).

on:
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: friendlyhealthy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
